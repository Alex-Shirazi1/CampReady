name: campready
description: CampReady campsite discovery and trip planning UI.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.2
  # First Integrations (CSEN 268): Firebase Auth, Firestore, FCM.
  # Firebase is configured for web (campready-group2). Pass
  # --dart-define=LOCAL_DEMO=true for an explicit local preview;
  # see lib/firebase_options.dart and docs/FIRST_INTEGRATIONS.md.
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  geolocator: ^14.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
